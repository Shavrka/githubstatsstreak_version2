name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # svaki dan u 03:00 UTC
  workflow_dispatch:        # ručno pokretanje iz Actions taba

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate SVG cards
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PAT_STATS }}
        run: node src/index.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "chore: update stats cards [skip ci]"
          git push
